defaults:
  - /defaults.yaml

experiment:
  run_name: pca_locality_afhqv2
  tags: [baseline, pca_locality, afhqv2]

dataset:
  name: afhqv2
  split: train
  download: true
  batch_size: 256
  subset_size: null
  resolution: 64

model:
  name: pca_locality
  params:
    temperature: 1.0
    mask_threshold: 0.02
    chunk_size: 512
    use_precomputed_pca: true  # download published PCA instead of computing covariance
