defaults:
  - /defaults.yaml

experiment:
  run_name: edm_unet_cifar10
  tags: [edm, unet, cifar10]

dataset:
  name: cifar10
  split: train
  download: true
  batch_size: 256
  subset_size: null

sampling:
  num_samples: 16
  batch_size: 16
  num_inference_steps: 18

model:
  name: edm_unet
  params:
    use_fp16: false
    # Checkpoint is auto-downloaded from the NVIDIA EDM CDN by dataset name.
    # Override with: checkpoint_path (local .pkl/.pt), checkpoint_url, or
    # hf_repo + hf_filename (a converted .pt re-hosted on HuggingFace).
