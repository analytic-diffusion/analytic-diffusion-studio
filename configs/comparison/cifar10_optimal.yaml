defaults:
  - /defaults.yaml
  - /comparison/_base_cifar10.yaml

# softmax empirical Bayes score (subset-indexed)
experiment:
  run_name: cmp_cifar10_optimal
  tags: [comparison, cifar10, optimal, heun]

dataset:
  subset_size: 8192  # cap the empirical index for tractable runtime

model:
  name: optimal
  params:
    temperature: 1.0
    num_neighbors: 200
